<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PITBULL Manager — Configuración</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="assets/logo.png" alt="PITBULL" class="brand-logo" />
        <div class="brand-text">
          <h1>PITBULL</h1>
          <span>manager v1.0</span>
        </div>
      </div>
      <nav class="topnav">
        <a href="index.html" class="topnav-link"> Productos</a>
        <a href="ventas.html" class="topnav-link"> Ventas</a>
        <a href="entradas.html" class="topnav-link"> Entradas</a>
        <a href="caja.html" class="topnav-link"> Caja</a>
        <a href="usuarios.html" class="topnav-link" id="nav-usuarios">
          Usuarios</a
        >
        <a href="configuracion.html" class="topnav-link active" id="nav-config">
          Configuración</a
        >
      </nav>
      <div class="topbar-info">
        <div class="user-menu">
          <span id="user-nombre" class="user-name">—</span>
          <button
            id="btn-logout"
            class="btn btn-sm btn-ghost"
            style="color: #fff; border-color: rgba(255, 255, 255, 0.3)"
          >
            Salir
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="card">
        <h2>Tasa de Cambio (Bs. / USD)</h2>
        <p class="hint">
          La tasa activa se usará para mostrar precios en dólares y al registrar
          ventas.
        </p>

        <form id="form-tasas">
          <div class="grid">
            <label
              >Tasa BCV (oficial)
              <input type="number" step="0.01" min="0" id="cfg-tasa-bcv" />
            </label>
            <label
              >Tasa Paralelo
              <input type="number" step="0.01" min="0" id="cfg-tasa-paralelo" />
            </label>
            <label
              >Tasa a usar
              <select id="cfg-tasa-usada">
                <option value="bcv">BCV (oficial)</option>
                <option value="paralelo">Paralelo</option>
              </select>
            </label>
          </div>

          <div class="conversion-preview">
            <strong>Vista previa:</strong>
            <span>1 USD = <span id="preview-tasa">0.00</span> Bs.</span>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Parámetros Fiscales</h2>
        <form id="form-fiscal">
          <div class="grid">
            <label
              >IVA (%)
              <input type="number" step="0.01" min="0" max="100" id="cfg-iva" />
            </label>
            <label
              >Margen de ganancia por defecto (%)
              <input type="number" step="0.01" min="0" id="cfg-margen" />
            </label>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Datos de la Empresa</h2>
        <form id="form-empresa">
          <div class="grid">
            <label
              >Nombre
              <input type="text" id="cfg-nombre-empresa" maxlength="150" />
            </label>
            <label
              >RIF
              <input type="text" id="cfg-rif-empresa" maxlength="20" />
            </label>
            <label
              >Teléfono
              <input type="text" id="cfg-telefono-empresa" maxlength="30" />
            </label>
          </div>
          <label
            >Dirección
            <textarea
              id="cfg-direccion-empresa"
              rows="2"
              maxlength="255"
            ></textarea>
          </label>
        </form>
      </section>

      <div class="actions-sticky">
        <button id="btn-guardar-todo" class="btn btn-primary">
          Guardar toda la configuración
        </button>
        <span id="msg-guardado" class="msg-exito" hidden> Guardado</span>
      </div>
    </main>

    <script src="js/sesion.js"></script>
    <script src="js/configuracion.js"></script>
  </body>
</html>
