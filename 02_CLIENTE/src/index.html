<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PITBULL Manager v1.0 — Productos</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="assets/logo.png" alt="PITBULL" class="brand-logo" />
        <div class="brand-text">
          <h1>PITBULL</h1>
          <span>manager v1.0</span>
        </div>
      </div>
      <nav class="topnav">
        <a href="index.html" class="topnav-link"> Productos</a>
        <a href="ventas.html" class="topnav-link"> Ventas</a>
        <a href="entradas.html" class="topnav-link"> Entradas</a>
        <a href="caja.html" class="topnav-link"> Caja</a>
        <a href="usuarios.html" class="topnav-link" id="nav-usuarios">
          Usuarios</a
        >
        <a href="configuracion.html" class="topnav-link" id="nav-config">
          Configuración</a
        >
      </nav>
      <div class="topbar-info">
        <div class="user-menu">
          <span id="user-nombre" class="user-name">—</span>
          <button
            id="btn-logout"
            class="btn btn-sm btn-ghost"
            style="color: #fff; border-color: rgba(255, 255, 255, 0.3)"
          >
            Salir
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <!-- FORMULARIO -->
      <section class="card">
        <h2 id="form-title">Nuevo Producto</h2>

        <form id="form-producto">
          <input type="hidden" id="prod-id" />

          <div class="grid">
            <label
              >SKU
              <input
                type="text"
                id="prod-sku"
                required
                maxlength="50"
                placeholder="PIT-005"
              />
            </label>
            <label
              >Nombre
              <input
                type="text"
                id="prod-nombre"
                required
                maxlength="150"
                placeholder="Ej: Cemento gris 42.5kg"
              />
            </label>
            <label
              >Categoría
              <select id="prod-categoria">
                <option value="">— Sin categoría —</option>
                <!-- se llena desde JS -->
              </select>
            </label>
            <label
              >Unidad
              <select id="prod-unidad">
                <option value="unidad">Unidad</option>
                <option value="kg">Kilogramo</option>
                <option value="litro">Litro</option>
                <option value="metro">Metro</option>
                <option value="saco">Saco</option>
                <option value="caja">Caja</option>
              </select>
            </label>
          </div>

          <label
            >Descripción
            <textarea id="prod-descripcion" rows="2" maxlength="500"></textarea>
          </label>

          <div class="grid">
            <label
              >Costo (Bs.)
              <input
                type="number"
                step="0.01"
                min="0"
                id="prod-costo"
                value="0"
              />
            </label>
            <label
              >Precio venta (Bs.) *
              <input
                type="number"
                step="0.01"
                min="0"
                id="prod-precio"
                value="0"
                required
              />
            </label>
            <label
              >Precio mayorista (Bs.)
              <input
                type="number"
                step="0.01"
                min="0"
                id="prod-precio-mayorista"
                placeholder="Opcional"
              />
            </label>
            <label
              >Stock
              <input type="number" min="0" id="prod-stock" value="0" />
            </label>
            <label
              >Stock mínimo
              <input type="number" min="0" id="prod-stock-minimo" value="0" />
            </label>
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button
              type="button"
              id="btn-cancelar"
              class="btn btn-ghost"
              hidden
            >
              ✖ Cancelar
            </button>
          </div>
        </form>
      </section>

      <!-- TABLA -->
      <section class="card">
        <div class="card-header">
          <h2>Listado de Productos</h2>
          <input
            type="search"
            id="buscar"
            placeholder=" Buscar por SKU o nombre..."
            class="search-input"
          />
        </div>

        <table id="tabla-productos">
          <thead>
            <tr>
              <th>ID</th>
              <th>SKU</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="7" class="empty">Cargando...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="js/sesion.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
