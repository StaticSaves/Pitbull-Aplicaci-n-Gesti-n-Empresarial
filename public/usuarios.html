<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PITBULL Manager — Usuarios</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="assets/logo.png" alt="PITBULL" class="brand-logo" />
        <div class="brand-text">
          <h1>PITBULL</h1>
          <span>manager v1.0</span>
        </div>
      </div>
      <nav class="topnav">
        <a href="index.html" class="topnav-link"> Panel</a>
        <a href="productos.html" class="topnav-link"> Productos</a>
        <a href="ventas.html" class="topnav-link"> Ventas</a>
        <a href="entradas.html" class="topnav-link"> Entradas</a>
        <a href="caja.html" class="topnav-link"> Caja</a>
        <a href="usuarios.html" class="topnav-link" id="nav-usuarios">
          Usuarios</a
        >
        <a href="configuracion.html" class="topnav-link" id="nav-config">
          Configuración</a
        >
      </nav>
      <div class="topbar-info">
        <div class="user-menu">
          <span id="user-nombre" class="user-name">—</span>
          <button
            id="btn-logout"
            class="btn btn-sm btn-ghost"
            style="color: #fff; border-color: rgba(255, 255, 255, 0.3)"
          >
            Salir
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="card">
        <h2 id="form-title">Nuevo Usuario</h2>
        <form id="form-usuario">
          <input type="hidden" id="user-id" />

          <div class="grid">
            <label
              >Cédula
              <input
                type="text"
                id="user-cedula"
                maxlength="20"
                placeholder="V-12345678"
              />
            </label>
            <label
              >Nombre completo *
              <input
                type="text"
                id="user-nombre-completo"
                required
                maxlength="150"
              />
            </label>
            <label
              >Email *
              <input type="email" id="user-email" required maxlength="150" />
            </label>
            <label
              >Teléfono
              <input
                type="text"
                id="user-telefono"
                maxlength="30"
                placeholder="0414-0000000"
              />
            </label>
            <label
              >Rol *
              <select id="user-rol" required>
                <option value="">— Seleccionar —</option>
              </select>
            </label>
            <label id="label-password"
              >Contraseña *
              <input
                type="password"
                id="user-password"
                minlength="6"
                autocomplete="new-password"
              />
            </label>
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button
              type="button"
              id="btn-cancelar"
              class="btn btn-ghost"
              hidden
            >
              ✖ Cancelar
            </button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>Usuarios del Sistema</h2>
          <input
            type="search"
            id="buscar"
            placeholder="🔍 Buscar..."
            class="search-input"
          />
        </div>

        <table id="tabla-usuarios">
          <thead>
            <tr>
              <th>ID</th>
              <th>Cédula</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="7" class="empty">Cargando...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <!-- Modal para cambiar contraseña -->
    <div id="modal-password" class="modal-overlay" hidden>
      <div class="modal-box">
        <h3>Cambiar contraseña</h3>
        <p class="hint">Usuario: <strong id="modal-user-nombre">—</strong></p>
        <form id="form-password">
          <input type="hidden" id="modal-user-id" />
          <label
            >Nueva contraseña *
            <input
              type="password"
              id="modal-password-nueva"
              required
              minlength="6"
            />
          </label>
          <label
            >Confirmar contraseña *
            <input
              type="password"
              id="modal-password-confirmar"
              required
              minlength="6"
            />
          </label>
          <div class="actions">
            <button type="submit" class="btn btn-primary">Cambiar</button>
            <button type="button" id="btn-cerrar-modal" class="btn btn-ghost">
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/sesion.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/usuarios.js"></script>
  </body>
</html>
