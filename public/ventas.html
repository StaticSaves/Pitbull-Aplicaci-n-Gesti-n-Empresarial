<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PITBULL Manager — Punto de Venta</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body class="pos-body">
    <header class="topbar">
      <div class="brand">
        <img src="assets/logo.png" alt="PITBULL" class="brand-logo" />
        <div class="brand-text">
          <h1>PITBULL</h1>
          <span>manager v1.0</span>
        </div>
      </div>
      <nav class="topnav">
    <a href="index.html" class="topnav-link"> Panel</a>
    <a href="productos.html" class="topnav-link"> Productos</a>
    <a href="ventas.html" class="topnav-link"> Ventas</a>
    <a href="entradas.html" class="topnav-link"> Entradas</a>
    <a href="caja.html" class="topnav-link"> Caja</a>
    <a href="usuarios.html" class="topnav-link" id="nav-usuarios"> Usuarios</a>
    <a href="configuracion.html" class="topnav-link" id="nav-config"> Configuración</a>
</nav>
      </nav>
      <div class="topbar-info">
        <div class="user-menu">
          <span id="user-nombre" class="user-name">—</span>
          <button
            id="btn-logout"
            class="btn btn-sm btn-ghost"
            style="color: #fff; border-color: rgba(255, 255, 255, 0.3)"
          >
            Salir
          </button>
        </div>
      </div>
    </header>

    <div class="pos-container">
      <!-- COLUMNA IZQUIERDA: CATÁLOGO -->
      <section class="pos-catalogo">
        <div class="pos-search">
          <input
            type="search"
            id="pos-buscar"
            placeholder=" Buscar por SKU o nombre..."
            autofocus
          />
        </div>
        <div id="pos-productos" class="pos-productos">
          <!-- Cards de productos -->
        </div>
      </section>

      <!-- COLUMNA DERECHA: CARRITO -->
<section class="pos-carrito">

    <!-- HEADER DEL CARRITO -->
    <div class="pos-carrito-header">
        <h2 id="carrito-titulo"> Carrito</h2>
        <button id="btn-vaciar" class="btn btn-sm btn-ghost">Vaciar</button>
    </div>

    <!-- SECCIÓN COLAPSABLE: DATOS DEL CLIENTE -->
    <div class="pos-seccion" id="seccion-cliente">
        <button type="button" class="pos-seccion-header" data-target="cliente-body">
            <span> Datos del cliente</span>
            <span class="pos-seccion-toggle" id="toggle-cliente">▼</span>
        </button>
        <div class="pos-seccion-body" id="cliente-body">
            <div class="pos-cliente">
                <input type="text" id="cli-nombre" placeholder="Nombre del cliente">
                <input type="text" id="cli-cedula" placeholder="Cédula">
                <input type="text" id="cli-telefono" placeholder="Teléfono">
            </div>
            <div id="cliente-resumen" class="cliente-resumen" hidden>
                <!-- Se llena cuando está colapsado -->
            </div>
        </div>
    </div>

    <!-- SECCIÓN COLAPSABLE: PRODUCTOS DEL CARRITO -->
    <div class="pos-seccion" id="seccion-productos">
        <button type="button" class="pos-seccion-header" data-target="productos-body">
            <span> Productos (<span id="contador-productos">0</span>)</span>
            <span class="pos-seccion-toggle" id="toggle-productos">▼</span>
        </button>
        <div class="pos-seccion-body" id="productos-body">
            <div id="pos-lineas" class="pos-lineas">
                <div class="empty">Agrega productos al carrito</div>
            </div>
        </div>
    </div>

    <!-- TOTALES (siempre visibles) -->
    <div class="pos-totales">
        <div class="total-row">
            <span>Subtotal:</span>
            <strong id="pos-subtotal">Bs. 0.00</strong>
        </div>
        <div class="total-row">
            <span>Descuento:</span>
            <input type="number" id="pos-descuento" step="0.01" min="0" value="0" style="width:100px;text-align:right">
        </div>
        <div class="total-row">
            <span>
                <input type="checkbox" id="pos-aplica-iva" checked> IVA (<span id="pos-iva-pct">16</span>%):
            </span>
            <strong id="pos-iva">Bs. 0.00</strong>
        </div>
        <div class="total-row total-final">
            <span>TOTAL:</span>
            <strong id="pos-total">Bs. 0.00</strong>
        </div>
    </div>

    <!-- MÉTODO DE PAGO -->
    <div class="pos-metodo">
        <label>Método de pago
            <select id="pos-metodo-pago">
                <option value="efectivo"> Efectivo</option>
                <option value="pago_movil"> Pago Móvil</option>
                <option value="transferencia"> Transferencia</option>
                <option value="punto_venta"> Punto de Venta</option>
            </select>
        </label>
    </div>

    <!-- BOTÓN COBRAR -->
    <button id="btn-cobrar" class="btn btn-primary btn-block btn-grande" disabled>
         COBRAR Y REGISTRAR
    </button>
</section>
    </div>

    <script src="js/sesion.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/ventas.js"></script>
  </body>
</html>
